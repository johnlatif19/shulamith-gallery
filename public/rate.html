<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقييمات — Shulamith Gallery</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg">
    
    <style>
        :root {
            --color-bg: #0d0b0a;
            --color-bg-secondary: #161210;
            --color-bg-card: #1e1a18;
            --color-bg-hover: #2a2421;
            --color-primary: #d4b892;
            --color-primary-light: #e8d4bc;
            --color-primary-dark: #b89a72;
            --color-text: #e8e0d4;
            --color-text-muted: #b0a89a;
            --color-text-dark: #8a8272;
            --color-border: #2a2421;
            --color-success: #2ecc71;
            --color-error: #e74c3c;
            --color-warning: #f39c12;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.7;
            min-height: 100vh;
        }

        body.rtl { direction: rtl; }
        body.ltr { direction: ltr; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-bg); }
        ::-webkit-scrollbar-thumb { background: var(--color-primary-dark); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(13, 11, 10, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo img { height: 45px; width: auto; border-radius: var(--radius-sm); }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-menu li a {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
            padding: 4px 0;
            position: relative;
        }

        .nav-menu li a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--color-primary);
            transition: var(--transition);
        }

        .nav-menu li a:hover,
        .nav-menu li a.active {
            color: var(--color-white);
        }

        .nav-menu li a:hover::after,
        .nav-menu li a.active::after {
            width: 100%;
        }

        body.ltr .nav-menu li a::after { left: 0; right: auto; }
        body.rtl .nav-menu li a::after { left: auto; right: 0; }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .lang-switch:hover {
            background: var(--color-bg-hover);
            border-color: var(--color-primary-dark);
        }

        .nav-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .nav-toggle span {
            display: block;
            width: 26px;
            height: 2px;
            background: var(--color-text);
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(13, 11, 10, 0.98);
                flex-direction: column;
                padding: 20px;
                gap: 16px;
                border-bottom: 1px solid var(--color-border);
            }
            .nav-menu.active { display: flex; }
            .nav-toggle { display: flex; }
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            padding: 110px 0 30px;
            text-align: center;
        }

        .page-header h1 {
            font-size: clamp(1.6rem, 4vw, 2.8rem);
            font-weight: 300;
            color: var(--color-primary);
            letter-spacing: 2px;
        }

        .page-header p {
            color: var(--color-text-muted);
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            margin-top: 8px;
        }

        /* ===== RATE FORM ===== */
        .rate-form-wrapper {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: clamp(16px, 4vw, 40px);
            margin-bottom: 40px;
        }

        .rate-form .form-group {
            margin-bottom: 20px;
        }

        .rate-form label {
            display: block;
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .rate-form .required-star {
            color: var(--color-error);
            margin-right: 2px;
        }

        .rate-form input,
        .rate-form textarea,
        .rate-form select {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: 1rem;
            transition: var(--transition);
            font-family: inherit;
        }

        .rate-form input:focus,
        .rate-form textarea:focus,
        .rate-form select:focus {
            outline: none;
            border-color: var(--color-primary-dark);
            box-shadow: 0 0 0 3px rgba(212, 184, 146, 0.08);
        }

        .rate-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .rate-form .form-error {
            color: var(--color-error);
            font-size: 0.85rem;
            display: block;
            margin-top: 4px;
            min-height: 20px;
        }

        .rate-form .form-hint {
            color: var(--color-text-dark);
            font-size: 0.8rem;
            margin-top: 4px;
            display: block;
        }

        .rate-form .char-counter {
            color: var(--color-text-dark);
            font-size: 0.8rem;
            text-align: left;
            margin-top: 4px;
            display: block;
        }

        body.rtl .rate-form .char-counter {
            text-align: right;
        }

        .rate-form .star-rating {
            display: flex;
            flex-direction: row-reverse;
            gap: 8px;
            justify-content: flex-end;
            padding: 8px 0;
        }

        body.ltr .rate-form .star-rating {
            flex-direction: row;
        }

        .rate-form .star-rating input {
            display: none;
        }

        .rate-form .star-rating label {
            font-size: 2.5rem;
            color: var(--color-border);
            cursor: pointer;
            transition: var(--transition);
            margin: 0;
            padding: 4px;
            line-height: 1;
        }

        .rate-form .star-rating label:hover,
        .rate-form .star-rating label:hover ~ label,
        .rate-form .star-rating input:checked ~ label {
            color: #f1c40f;
            transform: scale(1.1);
        }

        .rate-form .star-rating label:active {
            transform: scale(0.9);
        }

        body.ltr .rate-form .star-rating label:hover ~ label {
            color: #f1c40f;
        }

        .rate-form .rating-text {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: var(--color-bg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .submit-btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 184, 146, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loading { display: none; }

        .form-status {
            margin-top: 16px;
            padding: 12px;
            border-radius: var(--radius-sm);
            display: none;
            font-size: 0.95rem;
            text-align: center;
        }

        .form-status.success {
            display: block;
            background: rgba(46, 204, 113, 0.15);
            color: var(--color-success);
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .form-status.error {
            display: block;
            background: rgba(231, 76, 60, 0.15);
            color: var(--color-error);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .form-status.info {
            display: block;
            background: rgba(52, 152, 219, 0.15);
            color: #3498db;
            border: 1px solid rgba(52, 152, 219, 0.3);
        }

        /* ===== RATES LIST ===== */
        .rates-section {
            margin-top: 20px;
        }

        .rates-section h2 {
            color: var(--color-primary);
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 300;
            margin-bottom: 20px;
            text-align: center;
        }

        .rates-grid {
            display: grid;
            gap: 16px;
        }

        .rate-item {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: var(--transition);
            animation: fadeInUp 0.3s ease;
        }

        .rate-item:hover {
            border-color: var(--color-primary-dark);
            transform: translateY(-2px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rate-item .rate-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .rate-item .rate-name {
            color: var(--color-text);
            font-size: 1.05rem;
            font-weight: 500;
        }

        .rate-item .rate-stars {
            color: #f1c40f;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .rate-item .rate-stars .empty {
            color: var(--color-border);
        }

        .rate-item .rate-email {
            color: var(--color-text-dark);
            font-size: 0.85rem;
        }

        .rate-item .rate-opinion {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
            line-height: 1.8;
        }

        .rate-item .rate-date {
            color: var(--color-text-dark);
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-muted);
            grid-column: 1 / -1;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px 20px;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== SUCCESS ANIMATION ===== */
        .success-checkmark {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-checkmark.visible {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        .success-checkmark .check-icon {
            font-size: 4rem;
            color: var(--color-success);
            display: block;
            margin-bottom: 10px;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-border);
            padding: 40px 0 20px;
            text-align: center;
            margin-top: 40px;
        }

        .footer p {
            color: var(--color-text-dark);
            font-size: 0.85rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            .rate-form-wrapper { padding: 24px; }
            .rate-item { padding: 16px 20px; }
        }

        @media (max-width: 480px) {
            .page-header { padding: 100px 0 20px; }
            .page-header h1 { font-size: 1.6rem; }
            .rate-form-wrapper { padding: 16px; }
            .rate-item { padding: 14px 16px; }
            .rate-form .star-rating label { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/">
                    <img src="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg" alt="Shulamith Gallery" loading="lazy">
                </a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/" data-i18n="nav.home">الرئيسية</a></li>
                <li><a href="/gallery" data-i18n="nav.gallery">المعارض</a></li>
                <li><a href="https://shulamith-gallery.vercel.app/#about" data-i18n="nav.about">عن الفنانة</a></li>
                <li><a href="/order" data-i18n="nav.custom">طلبات خاصة</a></li>
                <li><a href="/rate" class="active" data-i18n="nav.rate">تقييم</a></li>
                <li><a href="/#contact" data-i18n="nav.contact">تواصل</a></li>
            </ul>
            <div class="nav-actions">
                <button class="lang-switch" id="langSwitch"><span class="lang-text" id="langText">EN</span></button>
                <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <!-- ===== PAGE HEADER ===== -->
    <section class="page-header">
        <div class="container">
            <h1 data-i18n="page.title">التقييمات</h1>
            <p data-i18n="page.subtitle">شاركنا رأيك وساعدنا في تحسين خدماتنا</p>
        </div>
    </section>

    <!-- ===== RATE FORM ===== -->
    <section>
        <div class="container">
            <div class="rate-form-wrapper">
                <form id="rateForm" class="rate-form" autocomplete="off" novalidate>
                    <input type="hidden" id="csrfToken" name="_csrf" value="">

                    <!-- ===== NAME ===== -->
                    <div class="form-group">
                        <label for="rateName">
                            <span data-i18n="form.name">الاسم</span>
                            <span class="required-star">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="rateName" 
                            name="name" 
                            required 
                            placeholder="أدخل اسمك الكامل"
                            autocomplete="name"
                            maxlength="100"
                            minlength="2"
                            aria-describedby="nameError"
                            data-i18n-placeholder="form.namePlaceholder"
                        >
                        <span class="form-error" id="nameError"></span>
                    </div>

                    <!-- ===== EMAIL ===== -->
                    <div class="form-group">
                        <label for="rateEmail">
                            <span data-i18n="form.email">البريد الإلكتروني</span>
                            <span class="required-star">*</span>
                        </label>
                        <input 
                            type="email" 
                            id="rateEmail" 
                            name="email" 
                            required 
                            placeholder="أدخل بريدك الإلكتروني"
                            autocomplete="email"
                            maxlength="100"
                            aria-describedby="emailError"
                            data-i18n-placeholder="form.emailPlaceholder"
                        >
                        <span class="form-error" id="emailError"></span>
                    </div>

                    <!-- ===== RATING ===== -->
                    <div class="form-group">
                        <label>
                            <span data-i18n="form.rating">التقييم</span>
                            <span class="required-star">*</span>
                        </label>
                        <div class="star-rating" id="starRating">
                            <input type="radio" name="rating" id="star5" value="5">
                            <label for="star5" title="ممتاز">★</label>
                            <input type="radio" name="rating" id="star4" value="4">
                            <label for="star4" title="جيد جداً">★</label>
                            <input type="radio" name="rating" id="star3" value="3">
                            <label for="star3" title="جيد">★</label>
                            <input type="radio" name="rating" id="star2" value="2">
                            <label for="star2" title="مقبول">★</label>
                            <input type="radio" name="rating" id="star1" value="1">
                            <label for="star1" title="ضعيف">★</label>
                        </div>
                        <span class="rating-text" id="ratingText" data-i18n="form.ratingText">اختر تقييمك</span>
                        <span class="form-error" id="ratingError"></span>
                    </div>

                    <!-- ===== OPINION ===== -->
                    <div class="form-group">
                        <label for="rateOpinion">
                            <span data-i18n="form.opinion">الرأي</span>
                            <span class="required-star">*</span>
                        </label>
                        <textarea 
                            id="rateOpinion" 
                            name="opinion" 
                            required 
                            placeholder="اكتب رأيك هنا... ما الذي أعجبك؟ ما الذي يمكن تحسينه؟"
                            rows="5"
                            maxlength="1000"
                            minlength="10"
                            aria-describedby="opinionError"
                            data-i18n-placeholder="form.opinionPlaceholder"
                        ></textarea>
                        <span class="form-error" id="opinionError"></span>
                        <span class="char-counter" id="charCounter">0 / 1000</span>
                        <span class="form-hint" data-i18n="form.opinionHint">رأيك مهم لنا ويساعد في تحسين خدماتنا</span>
                    </div>

                    <!-- ===== SUBMIT ===== -->
                    <button type="submit" class="submit-btn" id="rateSubmit">
                        <span data-i18n="form.submit">إرسال التقييم</span>
                        <span class="btn-loading" data-i18n="form.sending">جاري الإرسال...</span>
                    </button>

                    <div class="form-status" id="formStatus"></div>
                    
                    <div class="success-checkmark" id="successCheckmark">
                        <span class="check-icon">✅</span>
                        <p style="color: var(--color-success); font-size: 1.1rem;" data-i18n="form.success">شكراً لتقييمك!</p>
                        <p style="color: var(--color-text-muted); font-size: 0.9rem;" data-i18n="form.successSub">رأيك مهم لنا</p>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- ===== RATES LIST ===== -->
    <section>
        <div class="container">
            <div class="rates-section">
                <h2 data-i18n="rates.title">آراء العملاء</h2>
                <div class="rates-grid" id="ratesGrid">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p data-i18n="rates.loading">جاري تحميل التقييمات...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <p data-i18n="footer.copyright">© 2026 Shulamith Gallery. جميع الحقوق محفوظة</p>
        </div>
    </footer>

                'rates.empty': 'لا توجد تقييمات حالياً',
                'rates.emptySub': 'كن أول من يقيم!',
                'rates.error': 'حدث خطأ في تحميل التقييمات',
                'rates.errorSub': 'يرجى تحديث الصفحة',
                'footer.copyright': '© 2026 Shulamith Gallery. جميع الحقوق محفوظة'
            },
            en: {
                'nav.home': 'Home',
                'nav.gallery': 'Gallery',
                'nav.about': 'About',
                'nav.custom': 'Custom Orders',
                'nav.rate': 'Rate',
                'nav.contact': 'Contact',
                'page.title': 'Ratings',
                'page.subtitle': 'Share your feedback and help us improve our services',
                'form.name': 'Full Name',
                'form.namePlaceholder': 'Enter your full name',
                'form.email': 'Email Address',
                'form.emailPlaceholder': 'Enter your email address',
                'form.rating': 'Rating',
                'form.ratingText': 'Choose your rating',
                'form.ratingTexts': ['Poor', 'Fair', 'Good', 'Very Good', 'Excellent'],
                'form.ratingEmojis': ['😞', '😐', '🙂', '😊', '🤩'],
                'form.opinion': 'Opinion',
                'form.opinionPlaceholder': 'Write your opinion here... What did you like? What can be improved?',
                'form.opinionHint': 'Your opinion matters to us and helps improve our services',
                'form.submit': 'Submit Rating',
                'form.sending': 'Sending...',
                'form.success': 'Thank you for your rating!',
                'form.successSub': 'Your opinion matters to us',
                'form.error': 'An error occurred, please try again',
                'form.connectionError': 'Connection error, please try again',
                'form.nameRequired': 'Name is required (2-100 characters)',
                'form.emailInvalid': 'Invalid email address',
                'form.ratingRequired': 'Please select a rating',
                'form.opinionRequired': 'Opinion is required (10-1000 characters)',
                'form.rateLimit': 'Please wait before submitting another rating',
                'form.rateLimitInfo': 'Multiple ratings submitted. Please wait 1 minute before trying again.',
                'rates.title': 'Customer Reviews',
                'rates.loading': 'Loading ratings...',
                'rates.empty': 'No ratings yet',
                'rates.emptySub': 'Be the first to rate!',
                'rates.error': 'Error loading ratings',
                'rates.errorSub': 'Please refresh the page',
                'footer.copyright': '© 2026 Shulamith Gallery. All rights reserved'
            }
        };

        // ============================================
        // ===== SECURITY =====
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sanitizeInput(text) {
            if (!text) return '';
            return text
                .replace(/<script/gi, '&lt;script')
                .replace(/<\/script>/gi, '&lt;/script&gt;')
                .replace(/onerror=/gi, 'onerror=')
                .replace(/onload=/gi, 'onload=')
                .replace(/javascript:/gi, 'javascript:')
                .trim();
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validateName(name) {
            return name && name.length >= 2 && name.length <= 100;
        }

        function validateOpinion(text) {
            return text && text.length >= 10 && text.length <= 1000;
        }

        // ============================================
        // ===== CSRF TOKEN =====
        // ============================================
        let csrfToken = null;

        async function getCsrfToken() {
            try {
                const res = await fetch('/api/csrf-token');
                if (!res.ok) throw new Error('Failed to get CSRF token');
                const data = await res.json();
                csrfToken = data.token;
                return csrfToken;
            } catch (error) {
                console.error('CSRF token error:', error);
                return null;
            }
        }

        // ============================================
        // ===== LANGUAGE =====
        // ============================================
        let currentLang = localStorage.getItem('shulamith-lang') || 'ar';
        let refreshInterval = null;
        let isLoading = false;

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('shulamith-lang', lang);
            
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            document.body.className = lang === 'ar' ? 'rtl' : 'ltr';
            
            const langText = document.getElementById('langText');
            if (langText) {
                langText.textContent = lang === 'ar' ? 'EN' : 'AR';
            }
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            // Update rating text if already selected
            const selected = document.querySelector('input[name="rating"]:checked');
            if (selected) {
                updateRatingText(parseInt(selected.value));
            }
        }

        // ============================================
        // ===== NAV =====
        // ============================================
        document.getElementById('navToggle').addEventListener('click', function() {
            document.getElementById('navMenu').classList.toggle('active');
            this.classList.toggle('active');
        });

        // ============================================
        // ===== RATING TEXT =====
        // ============================================
        function updateRatingText(rating) {
            const text = document.getElementById('ratingText');
            const t = translations[currentLang];
            const index = rating - 1;
            if (t['form.ratingTexts'] && t['form.ratingEmojis'] && t['form.ratingTexts'][index]) {
                text.textContent = '⭐ ' + t['form.ratingTexts'][index] + ' ' + t['form.ratingEmojis'][index];
                text.style.color = '#f1c40f';
            } else {
                text.textContent = t['form.ratingText'] || 'اختر تقييمك';
                text.style.color = 'var(--color-text-muted)';
            }
        }

        document.querySelectorAll('input[name="rating"]').forEach(input => {
            input.addEventListener('change', function() {
                updateRatingText(parseInt(this.value));
            });
        });

        // ============================================
        // ===== CHAR COUNTER =====
        // ============================================
        const rateOpinion = document.getElementById('rateOpinion');
        const charCounter = document.getElementById('charCounter');

        rateOpinion.addEventListener('input', function() {
            const length = this.value.length;
            const max = 1000;
            charCounter.textContent = `${Math.min(length, max)} / ${max}`;
            
            if (length > 800) {
                charCounter.style.color = 'var(--color-warning)';
            } else {
                charCounter.style.color = 'var(--color-text-dark)';
            }
            
            if (length > max) {
                this.value = this.value.substring(0, max);
                charCounter.textContent = `${max} / ${max}`;
                charCounter.style.color = 'var(--color-error)';
            }
        });

        // ============================================
        // ===== INPUT SANITIZATION =====
        // ============================================
        document.querySelectorAll('input, textarea').forEach(input => {
            input.addEventListener('paste', function(e) {
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                if (pasted && /<script|<iframe|onerror|onload|javascript:/i.test(pasted)) {
                    e.preventDefault();
                    const cleaned = sanitizeInput(pasted);
                    this.value = cleaned;
                    this.style.borderColor = 'var(--color-error)';
                    setTimeout(() => {
                        this.style.borderColor = '';
                    }, 1000);
                }
            });

            input.addEventListener('blur', function() {
                if (this.value) {
                    this.value = sanitizeInput(this.value);
                }
            });
        });

        // ============================================
        // ===== SAFE RENDER FUNCTIONS =====
        // ============================================
        function createElementSafe(tag, content, attributes = {}) {
            const el = document.createElement(tag);
            el.textContent = content;
            Object.entries(attributes).forEach(([key, value]) => {
                el.setAttribute(key, value);
            });
            return el;
        }

        // ============================================
        // ===== LOAD RATES =====
        // ============================================
        async function loadRates() {
            if (isLoading) return;
            isLoading = true;
            
            const grid = document.getElementById('ratesGrid');
            const t = translations[currentLang];
            
            try {
                const res = await fetch('/api/rates');
                if (!res.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await res.json();

                if (!data || data.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            ${t['rates.empty']}
                            <br>
                            <span style="font-size: 0.85rem; color: var(--color-text-dark);">${t['rates.emptySub']}</span>
                        </div>
                    `;
                    isLoading = false;
                    return;
                }

                grid.innerHTML = '';
                data.forEach((rate, index) => {
                    const stars = '★'.repeat(rate.rating) + '☆'.repeat(5 - rate.rating);
                    const date = rate.createdAt ? new Date(rate.createdAt).toLocaleDateString(currentLang === 'ar' ? 'ar' : 'en') : '';
                    const delay = (index % 5) * 0.08;
                    
                    const item = document.createElement('div');
                    item.className = 'rate-item';
                    item.style.animationDelay = delay + 's';
                    
                    const header = document.createElement('div');
                    header.className = 'rate-header';
                    
                    const name = document.createElement('span');
                    name.className = 'rate-name';
                    name.textContent = rate.name;
                    
                    const starsSpan = document.createElement('span');
                    starsSpan.className = 'rate-stars';
                    starsSpan.textContent = stars;
                    
                    header.appendChild(name);
                    header.appendChild(starsSpan);
                    
                    const email = document.createElement('div');
                    email.className = 'rate-email';
                    email.textContent = rate.email;
                    
                    const opinion = document.createElement('div');
                    opinion.className = 'rate-opinion';
                    opinion.textContent = rate.opinion;
                    
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'rate-date';
                    dateDiv.textContent = '📅 ' + date;
                    
                    item.appendChild(header);
                    item.appendChild(email);
                    item.appendChild(opinion);
                    item.appendChild(dateDiv);
                    grid.appendChild(item);
                });

            } catch (error) {
                console.error('Error loading rates:', error);
                grid.innerHTML = `
                    <div class="empty-state">
                        ${t['rates.error']}
                        <br>
                        <span style="font-size: 0.85rem; color: var(--color-text-dark);">${t['rates.errorSub']}</span>
                    </div>
                `;
            }
            
            isLoading = false;
        }

        // ============================================
        // ===== SUBMIT RATE =====
        // ============================================
        document.getElementById('rateForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            const status = document.getElementById('formStatus');
            status.className = 'form-status';
            status.style.display = 'none';
            
            const successCheck = document.getElementById('successCheckmark');
            successCheck.classList.remove('visible');

            const name = document.getElementById('rateName');
            const email = document.getElementById('rateEmail');
            const opinion = document.getElementById('rateOpinion');
            const rating = document.querySelector('input[name="rating"]:checked');

            const nameVal = sanitizeInput(name.value.trim());
            const emailVal = email.value.trim();
            const opinionVal = sanitizeInput(opinion.value.trim());

            let isValid = true;

            if (!validateName(nameVal)) {
                document.getElementById('nameError').textContent = translations[currentLang]['form.nameRequired'];
                isValid = false;
                name.style.borderColor = 'var(--color-error)';
            } else {
                name.style.borderColor = '';
            }

            if (!validateEmail(emailVal)) {
                document.getElementById('emailError').textContent = translations[currentLang]['form.emailInvalid'];
                isValid = false;
                email.style.borderColor = 'var(--color-error)';
            } else {
                email.style.borderColor = '';
            }

            if (!rating) {
                document.getElementById('ratingError').textContent = translations[currentLang]['form.ratingRequired'];
                isValid = false;
            }

            if (!validateOpinion(opinionVal)) {
                document.getElementById('opinionError').textContent = translations[currentLang]['form.opinionRequired'];
                isValid = false;
                opinion.style.borderColor = 'var(--color-error)';
            } else {
                opinion.style.borderColor = '';
            }

            if (!isValid) {
                status.className = 'form-status error';
                status.style.display = 'block';
                status.textContent = '❌ ' + (translations[currentLang]['form.error'] || 'الرجاء تصحيح الأخطاء');
                return;
            }

            const submitBtn = document.getElementById('rateSubmit');
            submitBtn.disabled = true;
            submitBtn.querySelector('span:first-child').style.display = 'none';
            submitBtn.querySelector('.btn-loading').style.display = 'inline';

            try {
                const res = await fetch('/api/rates', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken || document.getElementById('csrfToken').value
                    },
                    body: JSON.stringify({
                        name: nameVal,
                        email: emailVal,
                        rating: parseInt(rating.value),
                        opinion: opinionVal
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    status.className = 'form-status success';
                    status.style.display = 'block';
                    status.textContent = '✅ ' + (translations[currentLang]['form.success'] || 'تم الإرسال بنجاح');
                    
                    successCheck.classList.add('visible');
                    
                    this.reset();
                    charCounter.textContent = '0 / 1000';
                    document.getElementById('ratingText').textContent = translations[currentLang]['form.ratingText'];
                    document.getElementById('ratingText').style.color = 'var(--color-text-muted)';
                    
                    await loadRates();
                    
                    status.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                } else {
                    status.className = 'form-status error';
                    status.style.display = 'block';
                    status.textContent = '❌ ' + (data.error || translations[currentLang]['form.error']);
                }
            } catch (error) {
                console.error('Rate submission error:', error);
                status.className = 'form-status error';
                status.style.display = 'block';
                status.textContent = '❌ ' + (translations[currentLang]['form.connectionError']);
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span:first-child').style.display = 'inline';
                submitBtn.querySelector('.btn-loading').style.display = 'none';
            }
        });

        // ============================================
        // ===== RATE LIMITING =====
        // ============================================
        let submitAttempts = 0;
        const MAX_SUBMIT_ATTEMPTS = 3;
        const SUBMIT_COOLDOWN = 60 * 1000;
        let submitCooldown = false;

        document.getElementById('rateForm').addEventListener('submit', function(e) {
            if (submitCooldown) {
                e.preventDefault();
                const status = document.getElementById('formStatus');
                status.className = 'form-status error';
                status.style.display = 'block';
                status.textContent = '⏳ ' + (translations[currentLang]['form.rateLimit'] || 'الرجاء الانتظار');
                return;
            }

            submitAttempts++;
            
            if (submitAttempts >= MAX_SUBMIT_ATTEMPTS) {
                submitCooldown = true;
                const status = document.getElementById('formStatus');
                status.className = 'form-status info';
                status.style.display = 'block';
                status.textContent = '⏳ ' + (translations[currentLang]['form.rateLimitInfo'] || 'تم إرسال عدة تقييمات. الرجاء الانتظار دقيقة واحدة.');
                
                setTimeout(() => {
                    submitAttempts = 0;
                    submitCooldown = false;
                    status.className = 'form-status';
                    status.style.display = 'none';
                }, SUBMIT_COOLDOWN);
            }
        });

        // ============================================
        // ===== AUTO REFRESH =====
        // ============================================
        function startAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            refreshInterval = setInterval(() => {
                if (!isLoading) {
                    loadRates();
                }
            }, 30000);
        }

        // ============================================
        // ===== INIT =====
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('shulamith-lang') || 'ar';
            setLanguage(savedLang);
            
            // ===== CSRF TOKEN =====
            getCsrfToken().then(token => {
                if (token) {
                    document.getElementById('csrfToken').value = token;
                }
            });
            
            loadRates();
            startAutoRefresh();
            
            setTimeout(() => {
                document.getElementById('rateName').focus();
            }, 300);
        });

        document.getElementById('langSwitch').addEventListener('click', function(e) {
            e.preventDefault();
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            setLanguage(newLang);
        });

        // ============================================
        // ===== CONSOLE PROTECTION =====
        // ============================================
        console.log('⭐ Shulamith Gallery - Rate Page (Secure)');
        console.log('🔒 Secured against XSS, CSRF, and spam attacks.');
        console.log('📱 Fully responsive for all devices.');

        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });

        console.log('✅ Rate page secured successfully.');
    </script>
</body>
</html>
