<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقييمات - Shulamith Gallery</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg">
    
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --color-bg: #0d0b0a;
            --color-bg-secondary: #161210;
            --color-bg-card: #1e1a18;
            --color-bg-hover: #2a2421;
            --color-primary: #d4b892;
            --color-primary-light: #e8d4bc;
            --color-primary-dark: #b89a72;
            --color-text: #e8e0d4;
            --color-text-muted: #b0a89a;
            --color-text-dark: #8a8272;
            --color-border: #2a2421;
            --color-error: #e74c3c;
            --color-success: #2ecc71;
            --color-warning: #f39c12;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        body.rtl { direction: rtl; }
        body.ltr { direction: ltr; }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--color-bg); }
        ::-webkit-scrollbar-thumb { background: var(--color-primary-dark); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            color: var(--color-primary);
            font-weight: 300;
            font-size: 28px;
        }

        .header .subtitle {
            color: var(--color-text-muted);
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            padding: 8px 20px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-back:hover {
            background: var(--color-bg-hover);
            border-color: var(--color-primary-dark);
        }

        .csrf-status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(46, 204, 113, 0.15);
            color: var(--color-success);
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        .csrf-status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-success);
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .csrf-status-badge.expired {
            background: rgba(231, 76, 60, 0.15);
            color: var(--color-error);
            border-color: rgba(231, 76, 60, 0.2);
        }

        .csrf-status-badge.expired .dot {
            background: var(--color-error);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .lang-switch:hover {
            background: var(--color-bg-hover);
            border-color: var(--color-primary-dark);
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-item {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 16px 20px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-item:hover {
            border-color: var(--color-primary-dark);
            transform: translateY(-2px);
        }

        .stat-item .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .stat-item .label {
            color: var(--color-text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        /* ===== RATE FORM ===== */
        .rate-form-container {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 30px;
        }

        .rate-form-container h2 {
            color: var(--color-primary);
            font-weight: 300;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .rate-form-container .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            color: var(--color-text-muted);
            font-size: 14px;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: var(--color-error);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: 15px;
            transition: var(--transition);
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--color-primary-dark);
            box-shadow: 0 0 0 3px rgba(212, 184, 146, 0.08);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group select option {
            background: var(--color-bg);
        }

        /* ===== STAR RATING ===== */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            gap: 8px;
            justify-content: flex-end;
            padding: 8px 0;
        }

        body.ltr .star-rating {
            flex-direction: row;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            font-size: 2.5rem;
            color: var(--color-border);
            cursor: pointer;
            transition: var(--transition);
            margin: 0;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #f1c40f;
        }

        body.ltr .star-rating label:hover ~ label {
            color: #f1c40f;
        }

        .rating-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .rating-display .stars {
            color: #f1c40f;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .rating-display .rating-text {
            color: var(--color-text-muted);
            font-size: 14px;
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: var(--color-bg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-submit:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 184, 146, 0.2);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-submit .btn-loading {
            display: none;
        }

        /* ===== ALERTS ===== */
        .alert {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            display: none;
            font-size: 15px;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.12);
            border: 1px solid rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }

        .alert-warning {
            background: rgba(243, 156, 18, 0.12);
            border: 1px solid rgba(243, 156, 18, 0.3);
            color: #f39c12;
        }

        /* ===== RATES LIST ===== */
        .rates-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .rates-header h2 {
            color: var(--color-primary);
            font-weight: 300;
            font-size: 22px;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 8px 14px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--color-primary-dark);
        }

        .rates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .rate-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 20px;
            transition: var(--transition);
        }

        .rate-card:hover {
            border-color: var(--color-primary-dark);
            transform: translateY(-3px);
        }

        .rate-card .rate-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .rate-card .rate-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-primary);
        }

        .rate-card .rate-stars {
            color: #f1c40f;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .rate-card .rate-email {
            color: var(--color-text-muted);
            font-size: 13px;
            direction: ltr;
            margin-bottom: 8px;
        }

        .rate-card .rate-opinion {
            color: var(--color-text);
            line-height: 1.7;
            font-size: 15px;
        }

        .rate-card .rate-date {
            display: block;
            color: var(--color-text-dark);
            font-size: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--color-border);
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-muted);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: var(--color-text);
            font-weight: 300;
            margin-bottom: 8px;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 400px;
            width: 100%;
        }

        body.ltr .toast-container {
            right: auto;
            left: 24px;
        }

        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            background: var(--color-bg-card);
            color: var(--color-text);
            animation: toastIn 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .toast.success { border-color: var(--color-success); }
        .toast.error { border-color: var(--color-error); }
        .toast.warning { border-color: var(--color-warning); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== RATE LIMIT INFO ===== */
        .rate-limit-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-text-muted);
            font-size: 13px;
            margin-top: 12px;
            padding: 10px 16px;
            background: rgba(243, 156, 18, 0.05);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(243, 156, 18, 0.1);
        }

        .rate-limit-info .icon {
            font-size: 18px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 22px;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .rate-form-container .form-row {
                grid-template-columns: 1fr;
            }

            .rates-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: repeat(3, 1fr);
            }

            .rate-form-container {
                padding: 20px;
            }

            .star-rating label {
                font-size: 2rem;
            }

            .toast-container {
                max-width: 90%;
                bottom: 12px;
                right: 12px;
            }

            body.ltr .toast-container {
                right: auto;
                left: 12px;
            }

            .csrf-status-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }

            .lang-switch {
                padding: 4px 10px;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .stats-bar {
                grid-template-columns: 1fr 1fr;
            }

            .rate-form-container {
                padding: 16px;
            }

            .rate-card {
                padding: 16px;
            }

            .rate-card .rate-name {
                font-size: 16px;
            }

            .rate-card .rate-stars {
                font-size: 16px;
            }
        }

        /* ===== AUTH CHECK OVERLAY ===== */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--color-bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .auth-overlay .spinner {
            width: 48px;
            height: 48px;
        }

        .auth-overlay p {
            color: var(--color-text-muted);
        }

        .auth-overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- ===== AUTH OVERLAY ===== -->
    <div class="auth-overlay" id="authOverlay">
        <div class="spinner"></div>
        <p>جاري التحقق من الجلسة...</p>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container" id="mainContent" style="display:none;">
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <h1>⭐ التقييمات</h1>
                <span class="subtitle">Shulamith Gallery</span>
            </div>
            <div class="header-actions">
                <span class="csrf-status-badge" id="csrfBadge">
                    <span class="dot" id="csrfDot"></span>
                    <span id="csrfStatusText">CSRF: نشط</span>
                </span>
                <button class="lang-switch" id="langSwitch">
                    <span class="lang-text">AR</span>
                </button>
                <a href="/dashboard.html" class="btn-back">← العودة للوحة</a>
            </div>
        </header>

        <!-- ===== STATS BAR ===== -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="number" id="totalRates">0</div>
                <div class="label">إجمالي التقييمات</div>
            </div>
            <div class="stat-item">
                <div class="number" id="avgRating">0.0</div>
                <div class="label">متوسط التقييم</div>
            </div>
            <div class="stat-item">
                <div class="number" id="fiveStarCount">0</div>
                <div class="label">⭐ 5 نجوم</div>
            </div>
            <div class="stat-item">
                <div class="number" id="todayRates">0</div>
                <div class="label">تقييمات اليوم</div>
            </div>
        </div>

        <!-- ===== RATE FORM ===== -->
        <div class="rate-form-container">
            <h2>📝 أضف تقييمك</h2>
            
            <div class="alert alert-success" id="alertSuccess"></div>
            <div class="alert alert-error" id="alertError"></div>
            <div class="alert alert-warning" id="alertWarning"></div>

            <form id="rateForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="rateName">الاسم <span class="required">*</span></label>
                        <input type="text" id="rateName" placeholder="أدخل اسمك" required>
                    </div>
                    <div class="form-group">
                        <label for="rateEmail">البريد الإلكتروني <span class="required">*</span></label>
                        <input type="email" id="rateEmail" placeholder="أدخل بريدك الإلكتروني" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>التقييم <span class="required">*</span></label>
                    <div class="star-rating" id="starRating">
                        <input type="radio" name="rating" id="star5" value="5">
                        <label for="star5">★</label>
                        <input type="radio" name="rating" id="star4" value="4">
                        <label for="star4">★</label>
                        <input type="radio" name="rating" id="star3" value="3">
                        <label for="star3">★</label>
                        <input type="radio" name="rating" id="star2" value="2">
                        <label for="star2">★</label>
                        <input type="radio" name="rating" id="star1" value="1">
                        <label for="star1">★</label>
                    </div>
                    <div class="rating-display" id="ratingDisplay">
                        <span class="stars" id="selectedStars">☆☆☆☆☆</span>
                        <span class="rating-text" id="ratingText">اختر تقييمك</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="rateOpinion">الرأي <span class="required">*</span></label>
                    <textarea id="rateOpinion" placeholder="شاركنا رأيك في المعرض..." required></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span>إرسال التقييم</span>
                    <span class="btn-loading">جاري الإرسال...</span>
                </button>

                <div class="rate-limit-info">
                    <span class="icon">⏳</span>
                    <span>يمكنك إرسال <strong>5 تقييمات</strong> كل <strong>5 دقائق</strong></span>
                </div>
            </form>
        </div>

        <!-- ===== RATES LIST ===== -->
        <div class="rates-header">
            <h2>📋 قائمة التقييمات</h2>
            <div class="filter-group">
                <select id="ratesFilter" class="filter-select">
                    <option value="all">الكل</option>
                    <option value="5">⭐ 5 نجوم</option>
                    <option value="4">⭐ 4 نجوم</option>
                    <option value="3">⭐ 3 نجوم</option>
                    <option value="2">⭐ 2 نجوم</option>
                    <option value="1">⭐ نجمة</option>
                </select>
                <button class="filter-select" id="refreshBtn" style="background:var(--color-primary); color:var(--color-bg); border:none;">
                    🔄 تحديث
                </button>
            </div>
        </div>

        <div id="ratesContainer">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>جاري تحميل التقييمات...</p>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================
        // ===== CSRF TOKEN MANAGEMENT =====
        // ============================================
        let csrfToken = null;
        let csrfRefreshInterval = null;
        const CSRF_REFRESH_INTERVAL = 4.5 * 60 * 1000; // 4.5 دقائق

        async function fetchCsrfToken() {
            try {
                const response = await fetch('/api/csrf-token', {
                    credentials: 'include'
                });
                if (!response.ok) throw new Error('Failed to fetch CSRF token');
                const data = await response.json();
                csrfToken = data.token;
                updateCsrfStatus(true);
                console.log('✅ CSRF Token refreshed, expires in 5 minutes');
                return csrfToken;
            } catch (error) {
                console.error('❌ Failed to fetch CSRF token:', error);
                updateCsrfStatus(false);
                return null;
            }
        }

        function updateCsrfStatus(valid) {
            const badge = document.getElementById('csrfBadge');
            const dot = document.getElementById('csrfDot');
            const text = document.getElementById('csrfStatusText');
            
            if (valid) {
                badge.classList.remove('expired');
                dot.style.background = '#2ecc71';
                text.textContent = 'CSRF: نشط (5 دقائق)';
            } else {
                badge.classList.add('expired');
                dot.style.background = '#e74c3c';
                text.textContent = 'CSRF: غير متاح';
            }
        }

        function startCsrfRefresh() {
            fetchCsrfToken();
            if (csrfRefreshInterval) clearInterval(csrfRefreshInterval);
            csrfRefreshInterval = setInterval(() => {
                fetchCsrfToken().then(() => {
                    showToast('🔄 تم تجديد CSRF Token تلقائياً', 'warning');
                });
            }, CSRF_REFRESH_INTERVAL);
        }

        // ============================================
        // ===== API FETCH WITH CSRF =====
        // ============================================
        async function fetchWithCsrf(url, options = {}) {
            if (!csrfToken) {
                await fetchCsrfToken();
            }

            const defaultOptions = {
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': csrfToken || ''
                }
            };

            const mergedOptions = {
                ...defaultOptions,
                ...options,
                headers: {
                    ...defaultOptions.headers,
                    ...(options.headers || {})
                }
            };

            let response = await fetch(url, mergedOptions);

            // لو انتهى الـ CSRF (403)
            if (response.status === 403) {
                console.warn('⚠️ CSRF token expired, refreshing...');
                await fetchCsrfToken();
                mergedOptions.headers['X-CSRF-Token'] = csrfToken;
                response = await fetch(url, mergedOptions);
            }

            return response;
        }

        // ============================================
        // ===== ESCAPE HTML =====
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // ===== TOAST =====
        // ============================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ============================================
        // ===== ALERTS =====
        // ============================================
        function showAlert(type, message) {
            const alerts = {
                success: document.getElementById('alertSuccess'),
                error: document.getElementById('alertError'),
                warning: document.getElementById('alertWarning')
            };

            Object.values(alerts).forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });

            const target = alerts[type];
            if (target) {
                target.textContent = message;
                target.classList.add('show');
                setTimeout(() => {
                    target.classList.remove('show');
                }, 6000);
            }
        }

        function hideAlerts() {
            ['alertSuccess', 'alertError', 'alertWarning'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('show');
                el.textContent = '';
            });
        }

        // ============================================
        // ===== STAR RATING =====
        // ============================================
        function setupStarRating() {
            const stars = document.querySelectorAll('.star-rating input');
            const display = document.getElementById('selectedStars');
            const text = document.getElementById('ratingText');

            const ratingTexts = {
                1: 'ضعيف',
                2: 'مقبول',
                3: 'جيد',
                4: 'جيد جداً',
                5: 'ممتاز'
            };

            stars.forEach(input => {
                input.addEventListener('change', function() {
                    const val = parseInt(this.value);
                    display.textContent = '★'.repeat(val) + '☆'.repeat(5 - val);
                    text.textContent = ratingTexts[val] || 'اختر تقييمك';
                });
            });
        }

        // ============================================
        // ===== LOAD RATES =====
        // ============================================
        async function loadRates(filter = 'all') {
            const container = document.getElementById('ratesContainer');
            container.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>جاري تحميل التقييمات...</p>
                </div>
            `;

            try {
                let url = '/api/rates';
                if (filter !== 'all') url += `?rating=${filter}`;

                const res = await fetch(url);
                if (!res.ok) throw new Error('Failed to fetch rates');
                const data = await res.json();

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <h3>لا توجد تقييمات</h3>
                            <p>كن أول من يقيّم Shulamith Gallery!</p>
                        </div>
                    `;
                    updateStats([]);
                    return;
                }

                // تحديث الإحصائيات
                updateStats(data);

                let html = '<div class="rates-grid">';
                data.forEach(rate => {
                    const stars = '★'.repeat(rate.rating) + '☆'.repeat(5 - rate.rating);
                    const date = rate.createdAt ? new Date(rate.createdAt).toLocaleDateString('ar-EG', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }) : '';

                    html += `
                        <div class="rate-card">
                            <div class="rate-header">
                                <span class="rate-name">${escapeHtml(rate.name)}</span>
                                <span class="rate-stars">${stars}</span>
                            </div>
                            <div class="rate-email">📧 ${escapeHtml(rate.email)}</div>
                            <p class="rate-opinion">${escapeHtml(rate.opinion)}</p>
                            <span class="rate-date">📅 ${date}</span>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (error) {
                console.error('Error loading rates:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <h3>حدث خطأ</h3>
                        <p>تعذر تحميل التقييمات. حاول مرة أخرى.</p>
                    </div>
                `;
            }
        }

        // ============================================
        // ===== UPDATE STATS =====
        // ============================================
        function updateStats(rates) {
            if (!rates || rates.length === 0) {
                document.getElementById('totalRates').textContent = '0';
                document.getElementById('avgRating').textContent = '0.0';
                document.getElementById('fiveStarCount').textContent = '0';
                document.getElementById('todayRates').textContent = '0';
                return;
            }

            const total = rates.length;
            const sum = rates.reduce((acc, r) => acc + r.rating, 0);
            const avg = (sum / total).toFixed(1);
            const fiveStar = rates.filter(r => r.rating === 5).length;

            // تقييمات اليوم
            const today = new Date().toDateString();
            const todayRates = rates.filter(r => {
                if (!r.createdAt) return false;
                const d = new Date(r.createdAt);
                return d.toDateString() === today;
            }).length;

            document.getElementById('totalRates').textContent = total;
            document.getElementById('avgRating').textContent = avg;
            document.getElementById('fiveStarCount').textContent = fiveStar;
            document.getElementById('todayRates').textContent = todayRates;
        }

        // ============================================
        // ===== SUBMIT RATE =====
        // ============================================
        async function submitRate(event) {
            event.preventDefault();
            hideAlerts();

            const name = document.getElementById('rateName');
            const email = document.getElementById('rateEmail');
            const opinion = document.getElementById('rateOpinion');
            const ratingInput = document.querySelector('input[name="rating"]:checked');

            // التحقق من الحقول
            if (!name.value.trim()) {
                showAlert('error', '⚠️ الاسم مطلوب');
                name.focus();
                return;
            }

            if (!email.value.trim()) {
                showAlert('error', '⚠️ البريد الإلكتروني مطلوب');
                email.focus();
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
                showAlert('error', '⚠️ بريد إلكتروني غير صالح');
                email.focus();
                return;
            }

            if (!ratingInput) {
                showAlert('error', '⚠️ الرجاء اختيار تقييم');
                return;
            }

            if (!opinion.value.trim()) {
                showAlert('error', '⚠️ الرأي مطلوب');
                opinion.focus();
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.querySelector('span:first-child').style.display = 'none';
            submitBtn.querySelector('.btn-loading').style.display = 'inline';

            try {
                const response = await fetchWithCsrf('/api/rates', {
                    method: 'POST',
                    body: JSON.stringify({
                        name: name.value.trim(),
                        email: email.value.trim(),
                        rating: parseInt(ratingInput.value),
                        opinion: opinion.value.trim()
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('success', '✅ تم إرسال التقييم بنجاح! شكراً لك 🙏');
                    showToast('✅ تم إرسال التقييم بنجاح');
                    document.getElementById('rateForm').reset();
                    document.getElementById('selectedStars').textContent = '☆☆☆☆☆';
                    document.getElementById('ratingText').textContent = 'اختر تقييمك';
                    document.querySelectorAll('input[name="rating"]').forEach(el => el.checked = false);
                    
                    // إعادة تحميل التقييمات
                    const filter = document.getElementById('ratesFilter').value;
                    loadRates(filter);
                } else if (response.status === 429) {
                    // Rate Limiter - 5 دقائق
                    showAlert('warning', '⏳ ' + (result.error || 'تم إرسال عدد كبير من التقييمات. الرجاء الانتظار 5 دقائق.'));
                    showToast('⏳ انتظر 5 دقائق قبل المحاولة مرة أخرى', 'warning');
                } else if (response.status === 403) {
                    showAlert('warning', '🛡️ ' + (result.error || 'انتهت صلاحية الجلسة. تم تحديثها، حاول مرة أخرى.'));
                    await fetchCsrfToken();
                } else {
                    showAlert('error', '❌ ' + (result.error || 'حدث خطأ في الإرسال'));
                }
            } catch (error) {
                console.error('Submit rate error:', error);
                showAlert('error', '❌ حدث خطأ في الاتصال بالخادم');
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span:first-child').style.display = 'inline';
                submitBtn.querySelector('.btn-loading').style.display = 'none';
            }
        }

        // ============================================
        // ===== LANGUAGE =====
        // ============================================
        let currentLang = localStorage.getItem('shulamith-lang') || 'ar';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('shulamith-lang', lang);
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.className = lang === 'ar' ? 'rtl' : 'ltr';
            const langText = document.querySelector('.lang-text');
            if (langText) langText.textContent = lang.toUpperCase();
        }

        function toggleLanguage() {
            setLanguage(currentLang === 'ar' ? 'en' : 'ar');
        }

        // ============================================
        // ===== AUTH CHECK =====
        // ============================================
        function getAuthToken() {
            return localStorage.getItem('shulamith-token');
        }

        async function checkAuth() {
            const overlay = document.getElementById('authOverlay');
            const main = document.getElementById('mainContent');
            
            const token = getAuthToken();
            if (!token) {
                // مش مسجل دخول، لكن نقدر نعرض التقييمات العامة
                overlay.classList.add('hidden');
                main.style.display = 'block';
                return true;
            }

            try {
                const res = await fetch('/api/verify', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.status === 401) {
                    localStorage.removeItem('shulamith-token');
                }
                
                overlay.classList.add('hidden');
                main.style.display = 'block';
                return true;
            } catch (error) {
                console.error('Auth check error:', error);
                overlay.classList.add('hidden');
                main.style.display = 'block';
                return true;
            }
        }

        // ============================================
        // ===== INITIALIZATION =====
        // ============================================
        document.addEventListener('DOMContentLoaded', async function() {
            // اللغة
            setLanguage(currentLang);
            
            // CSRF
            startCsrfRefresh();
            
            // Star Rating
            setupStarRating();
            
            // التحقق من المصادقة
            await checkAuth();

            // تحميل التقييمات
            const filter = document.getElementById('ratesFilter').value;
            loadRates(filter);

            // ===== EVENT LISTENERS =====
            
            // اللغة
            document.getElementById('langSwitch').addEventListener('click', toggleLanguage);

            // فلتر التقييمات
            document.getElementById('ratesFilter').addEventListener('change', function() {
                loadRates(this.value);
            });

            // زر التحديث
            document.getElementById('refreshBtn').addEventListener('click', function() {
                const filter = document.getElementById('ratesFilter').value;
                loadRates(filter);
                showToast('🔄 تم تحديث التقييمات', 'warning');
            });

            // فورم التقييم
            document.getElementById('rateForm').addEventListener('submit', submitRate);

            // تنبيه المستخدم بانتهاء الـ CSRF قريباً
            setInterval(() => {
                const badge = document.getElementById('csrfBadge');
                if (!badge.classList.contains('expired')) {
                    const dot = document.getElementById('csrfDot');
                    dot.style.background = '#f39c12';
                    document.getElementById('csrfStatusText').textContent = 'CSRF: ينتهي قريباً';
                    setTimeout(() => {
                        dot.style.background = '#2ecc71';
                        document.getElementById('csrfStatusText').textContent = 'CSRF: نشط (5 دقائق)';
                    }, 30000);
                }
            }, 4 * 60 * 1000); // كل 4 دقائق

            console.log('✅ Rates page ready (CSRF: 5min, Rate Limit: 5 per 5min)');
        });

        // ============================================
        // ===== CLEANUP =====
        // ============================================
        window.addEventListener('beforeunload', () => {
            if (csrfRefreshInterval) {
                clearInterval(csrfRefreshInterval);
            }
        });
    </script>
</body>
</html>
