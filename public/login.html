<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — Shulamith Gallery</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg">
    
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --color-bg: #0d0b0a;
            --color-bg-secondary: #161210;
            --color-bg-card: #1e1a18;
            --color-bg-hover: #2a2421;
            --color-primary: #d4b892;
            --color-primary-light: #e8d4bc;
            --color-primary-dark: #b89a72;
            --color-text: #e8e0d4;
            --color-text-muted: #b0a89a;
            --color-text-dark: #8a8272;
            --color-border: #2a2421;
            --color-error: #e74c3c;
            --color-success: #2ecc71;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif;
            background: var(--color-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* ===== BACKGROUND ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                url('https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg') center center / cover no-repeat;
            opacity: 0.15;
            z-index: 0;
            animation: bgZoom 30s ease-in-out infinite alternate;
        }

        @keyframes bgZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* ===== LOGIN CONTAINER ===== */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: rgba(22, 18, 16, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 48px 40px 40px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            transition: var(--transition);
        }

        .login-card:hover {
            border-color: rgba(212, 184, 146, 0.2);
        }

        /* ===== HEADER ===== */
        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo {
            height: 70px;
            width: auto;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            display: inline-block;
        }

        .login-header h1 {
            color: var(--color-primary);
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .login-header p {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* ===== FORM ===== */
        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form label {
            display: block;
            color: var(--color-text-muted);
            font-size: 0.85rem;
            font-weight: 400;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .login-form input {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: 1rem;
            transition: var(--transition);
            font-family: inherit;
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--color-primary-dark);
            box-shadow: 0 0 0 3px rgba(212, 184, 146, 0.08);
        }

        .login-form input::placeholder {
            color: var(--color-text-dark);
        }

        .form-error {
            color: var(--color-error);
            font-size: 0.8rem;
            display: block;
            margin-top: 4px;
            min-height: 18px;
        }

        /* ===== PASSWORD TOGGLE - LEFT SIDE (RTL) ===== */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-left: 48px;  /* مساحة للزر على اليسار */
        }

        .toggle-password {
            position: absolute;
            left: 12px;  /* الزر على اليسار */
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--color-text-dark);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            transition: var(--transition);
        }

        .toggle-password:hover {
            color: var(--color-text);
        }

        /* ===== SUBMIT BUTTON ===== */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: var(--color-bg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .login-btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 184, 146, 0.2);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loading {
            display: none;
        }

        /* ===== STATUS ===== */
        .login-status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            display: none;
            font-size: 0.9rem;
            text-align: center;
        }

        .login-status.success {
            display: block;
            background: rgba(46, 204, 113, 0.12);
            color: var(--color-success);
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        .login-status.error {
            display: block;
            background: rgba(231, 76, 60, 0.12);
            color: var(--color-error);
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        /* ===== FOOTER ===== */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--color-border);
        }

        .login-footer a {
            color: var(--color-text-muted);
            font-size: 0.9rem;
            transition: var(--transition);
            text-decoration: none;
        }

        .login-footer a:hover {
            color: var(--color-primary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 28px;
            }

            .login-logo {
                height: 55px;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-form input {
                padding: 10px 14px;
                font-size: 0.95rem;
            }

            .login-btn {
                padding: 12px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 24px 16px 20px;
            }

            .login-logo {
                height: 45px;
            }

            .login-header h1 {
                font-size: 1.2rem;
            }
        }

        /* ===== LTR ===== */
        body.ltr .password-wrapper input {
            padding-left: 16px;
            padding-right: 48px;
        }

        body.ltr .toggle-password {
            left: auto;
            right: 12px;
        }

        body.ltr .login-footer a {
            display: inline-block;
        }

        /* ===== SECURITY NOTICE ===== */
        .security-notice {
            margin-top: 12px;
            padding: 8px 12px;
            background: rgba(212, 184, 146, 0.05);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(212, 184, 146, 0.1);
            font-size: 0.75rem;
            color: var(--color-text-dark);
            text-align: center;
        }

        .security-notice span {
            color: var(--color-primary-dark);
        }

        /* ===== RATE LIMIT WARNING ===== */
        .rate-limit-warning {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(231, 76, 60, 0.08);
            border: 1px solid rgba(231, 76, 60, 0.15);
            border-radius: var(--radius-sm);
            color: var(--color-error);
            font-size: 0.85rem;
            text-align: center;
        }

        .rate-limit-warning.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg" alt="Shulamith Gallery" class="login-logo" loading="lazy">
                <h1>Shulamith Gallery</h1>
            </div>
            
            <form id="loginForm">
                <input type="hidden" id="csrfToken" name="_csrf" value="">
                <!-- ===== CSRF TOKEN ===== -->
                <input type="hidden" id="csrfToken" value="">
                
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        placeholder="أدخل اسم المستخدم" 
                        autocomplete="username"
                        maxlength="50"
                        aria-describedby="usernameError"
                    >
                    <span class="form-error" id="usernameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            placeholder="أدخل كلمة المرور" 
                            autocomplete="current-password"
                            maxlength="100"
                            aria-describedby="passwordError"
                        >
                        <button 
                            type="button" 
                            class="toggle-password" 
                            id="togglePassword" 
                            aria-label="إظهار/إخفاء كلمة المرور"
                            title="إظهار/إخفاء كلمة المرور"
                        >
                            🐵
                        </button>
                    </div>
                    <span class="form-error" id="passwordError"></span>
                </div>
                
                <!-- ===== RATE LIMIT WARNING ===== -->
                <div class="rate-limit-warning" id="rateLimitWarning">
                    تم تجاوز عدد محاولات تسجيل الدخول. الرجاء الانتظار 15 دقيقة.
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <span>تسجيل الدخول</span>
                    <span class="btn-loading">جاري التحقق...</span>
                </button>
                
                <div class="login-status" id="loginStatus"></div>
                

            </form>
            
            <div class="login-footer">
                <a href="/">العودة الى الموقع الرئيسي</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // ===== SECURITY: Anti-Brute Force =====
        // ============================================
        
        // ===== DOM REFS =====
        const form = document.getElementById('loginForm');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const loginBtn = document.getElementById('loginBtn');
        const loginStatus = document.getElementById('loginStatus');
        const togglePassword = document.getElementById('togglePassword');
        const rateLimitWarning = document.getElementById('rateLimitWarning');

        // ===== STATE =====
        let loginAttempts = 0;
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 15 * 60 * 1000; // 15 دقيقة
        let isLocked = false;
        let lockoutTimer = null;

        // ============================================
        // ===== TOGGLE PASSWORD =====
        // ============================================
        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.textContent = type === 'password' ? '🐵' : '🙈';
            this.setAttribute('aria-label', type === 'password' ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
        });

        // ============================================
        // ===== CHECK AUTH =====
        // ============================================
// 1. جلب CSRF Token
async function initLogin() {
    try {
        const res = await fetch('/api/csrf-token');
        const data = await res.json();
        document.getElementById('csrfToken').value = data.token;
    } catch (error) {
        console.error('CSRF init error:', error);
    }
}

// 2. تعديل دالة تسجيل الدخول
async function handleLogin(e) {
    e.preventDefault();
    
    const csrfToken = document.getElementById('csrfToken').value;
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': csrfToken
            },
            body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (res.ok) {
            // ✅ استخدام sessionStorage بدلاً من localStorage
            sessionStorage.setItem('shulamith-token', data.token);
            window.location.href = '/dashboard';
        } else {
            showError(data.error || 'فشل تسجيل الدخول');
        }
    } catch (error) {
        showError('حدث خطأ في الاتصال');
    }
}

// 3. عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', function() {
    initLogin();
    
    // التحقق من توكن موجود
    const token = sessionStorage.getItem('shulamith-token');
    if (token) {
        fetch('/api/verify', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(res => res.json())
        .then(data => {
            if (data.valid) {
                window.location.href = '/dashboard';
            }
        })
        .catch(() => {});
    }
});

        // ============================================
        // ===== KEYBOARD SHORTCUTS =====
        // ============================================
        document.addEventListener('keydown', function(e) {
            // Enter = Submit
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active === username || active === password) {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            }
            // Escape = Go Home
            if (e.key === 'Escape') {
                window.location.href = '/';
            }
        });

        // ============================================
        // ===== INPUT SANITIZATION =====
        // ============================================
        username.addEventListener('input', function() {
            this.value = this.value.replace(/[<>&"'/]/g, '');
        });

        password.addEventListener('input', function() {
            this.value = this.value.replace(/[<>&"'/]/g, '');
        });

        // ============================================
        // ===== RATE LIMIT PERSISTENCE =====
        // ============================================
        // حفظ حالة القفل في localStorage
        function saveLockState() {
            if (isLocked) {
                localStorage.setItem('login-locked', 'true');
                localStorage.setItem('login-lock-time', lockoutTimer.toString());
            } else {
                localStorage.removeItem('login-locked');
                localStorage.removeItem('login-lock-time');
            }
        }

        function restoreLockState() {
            const locked = localStorage.getItem('login-locked');
            const lockTime = parseInt(localStorage.getItem('login-lock-time') || '0');
            
            if (locked === 'true' && lockTime > 0) {
                const elapsed = Date.now() - lockTime;
                if (elapsed < LOCKOUT_TIME) {
                    isLocked = true;
                    lockoutTimer = lockTime;
                    rateLimitWarning.classList.add('visible');
                    loginStatus.className = 'login-status error';
                    loginStatus.style.display = 'block';
                    const remaining = Math.ceil((LOCKOUT_TIME - elapsed) / 60000);
                    loginStatus.textContent = `تم حظر المحاولات مؤقتاً. الرجاء الانتظار ${remaining} دقيقة.`;
                    
                    // إعادة تعيين بعد انتهاء الوقت
                    const remainingTime = LOCKOUT_TIME - elapsed;
                    setTimeout(() => {
                        loginAttempts = 0;
                        isLocked = false;
                        rateLimitWarning.classList.remove('visible');
                        loginStatus.className = 'login-status';
                        loginStatus.style.display = 'none';
                        localStorage.removeItem('login-locked');
                        localStorage.removeItem('login-lock-time');
                    }, remainingTime);
                } else {
                    localStorage.removeItem('login-locked');
                    localStorage.removeItem('login-lock-time');
                }
            }
        }

        // ============================================
        // ===== SECURE INPUT CLEANUP =====
        // ============================================
        // مسح الحقول عند إعادة تحميل الصفحة
        window.addEventListener('beforeunload', function() {
            if (username) username.value = '';
            if (password) password.value = '';
        });

        // منع حفظ كلمة المرور في المتصفح
        document.addEventListener('DOMContentLoaded', function() {
            if (password) {
                password.setAttribute('autocomplete', 'off');
            }
        });

        // ============================================
        // ===== ENTER KEY PROTECTION =====
        // ============================================
        // منع إرسال النموذج عن طريق الخطأ
        form.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const target = e.target;
                if (target.tagName === 'INPUT' && target.type !== 'submit') {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============================================
        // ===== INIT =====
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // ===== CHECK AUTH =====
            checkAuth();
            
            // ===== RESTORE LOCK STATE =====
            restoreLockState();
            
            // ===== SETUP FORM =====
            form.addEventListener('submit', handleLogin);
            
            // ===== GENERATE CSRF TOKEN =====
            const csrfToken = document.getElementById('csrfToken');
            if (csrfToken) {
                csrfToken.value = 'csrf-' + Date.now() + '-' + Math.random().toString(36).substring(2, 15);
            }
            
            // ===== FOCUS FIRST INPUT =====
            if (username) {
                setTimeout(() => username.focus(), 100);
            }
            
            // ===== SAVE LOCK STATE =====
            setInterval(saveLockState, 5000);
        });

        // ============================================
        // =====CONSOLE PROTECTION =====
        // ============================================
        // منع عرض معلومات حساسة في الـ Console
        console.log('%c Shulamith Gallery - Login Page (Secure)', 
            'color: #d4b892; font-size: 16px; font-weight: bold;');
        console.log('%c Do not share your credentials with anyone.', 
            'color: #e74c3c; font-size: 12px;');

        // منع محاولات التلاعب بالـ Console
        Object.defineProperty(window, 'token', {
            get: function() { 
                console.warn('Access to token is restricted.');
                return null; 
            }
        });

        // ============================================
        // ===== XSS PROTECTION =====
        // ============================================
        // منع تنفيذ أي سكريبت من خلال حقول الإدخال
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('paste', function(e) {
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                if (pasted && /<script|<iframe|onerror|onload|javascript:/i.test(pasted)) {
                    e.preventDefault();
                    this.value = pasted.replace(/<script|<iframe|onerror|onload|javascript:/gi, '');
                    this.style.borderColor = 'var(--color-error)';
                    setTimeout(() => {
                        this.style.borderColor = '';
                    }, 1000);
                }
            });
        });

        console.log(' Login page secured successfully.');
    </script>
</body>
</html>
