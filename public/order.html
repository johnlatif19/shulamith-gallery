<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب عمل فني — Shulamith Gallery</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg">
    
    <style>
        /* نفس استايل rate.html مع تعديلات بسيطة */
        :root {
            --color-bg: #0d0b0a;
            --color-bg-secondary: #161210;
            --color-bg-card: #1e1a18;
            --color-bg-hover: #2a2421;
            --color-primary: #d4b892;
            --color-primary-light: #e8d4bc;
            --color-primary-dark: #b89a72;
            --color-text: #e8e0d4;
            --color-text-muted: #b0a89a;
            --color-text-dark: #8a8272;
            --color-border: #2a2421;
            --color-success: #2ecc71;
            --color-error: #e74c3c;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.7;
            min-height: 100vh;
        }

        body.rtl { direction: rtl; }
        body.ltr { direction: ltr; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-bg); }
        ::-webkit-scrollbar-thumb { background: var(--color-primary-dark); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }

        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(13, 11, 10, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo img { height: 45px; width: auto; border-radius: var(--radius-sm); }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-menu li a {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
            padding: 4px 0;
            position: relative;
        }

        .nav-menu li a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--color-primary);
            transition: var(--transition);
        }

        .nav-menu li a:hover,
        .nav-menu li a.active {
            color: var(--color-white);
        }

        .nav-menu li a:hover::after,
        .nav-menu li a.active::after {
            width: 100%;
        }

        body.ltr .nav-menu li a::after { left: 0; right: auto; }
        body.rtl .nav-menu li a::after { left: auto; right: 0; }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .lang-switch:hover {
            background: var(--color-bg-hover);
            border-color: var(--color-primary-dark);
        }

        .nav-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .nav-toggle span {
            display: block;
            width: 26px;
            height: 2px;
            background: var(--color-text);
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(13, 11, 10, 0.98);
                flex-direction: column;
                padding: 20px;
                gap: 16px;
                border-bottom: 1px solid var(--color-border);
            }
            .nav-menu.active { display: flex; }
            .nav-toggle { display: flex; }
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            padding: 110px 0 30px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 300;
            color: var(--color-primary);
            letter-spacing: 2px;
        }

        .page-header p {
            color: var(--color-text-muted);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        /* ===== ORDER FORM ===== */
        .order-form-wrapper {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 40px;
            margin-bottom: 40px;
        }

        .order-form .form-group {
            margin-bottom: 20px;
        }

        .order-form label {
            display: block;
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .order-form input,
        .order-form textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: 1rem;
            transition: var(--transition);
            font-family: inherit;
        }

        .order-form input:focus,
        .order-form textarea:focus {
            outline: none;
            border-color: var(--color-primary-dark);
            box-shadow: 0 0 0 3px rgba(212, 184, 146, 0.08);
        }

        .order-form textarea {
            resize: vertical;
            min-height: 120px;
        }

        .order-form .form-error {
            color: var(--color-error);
            font-size: 0.85rem;
            display: block;
            margin-top: 4px;
            min-height: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: var(--color-bg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .submit-btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 184, 146, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loading { display: none; }

        .form-status {
            margin-top: 16px;
            padding: 12px;
            border-radius: var(--radius-sm);
            display: none;
            font-size: 0.95rem;
            text-align: center;
        }

        .form-status.success {
            display: block;
            background: rgba(46, 204, 113, 0.15);
            color: var(--color-success);
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .form-status.error {
            display: block;
            background: rgba(231, 76, 60, 0.15);
            color: var(--color-error);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-border);
            padding: 40px 0 20px;
            text-align: center;
            margin-top: 40px;
        }

        .footer p {
            color: var(--color-text-dark);
            font-size: 0.85rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            .order-form-wrapper { padding: 24px; }
        }

        @media (max-width: 480px) {
            .page-header { padding: 100px 0 20px; }
            .page-header h1 { font-size: 1.6rem; }
            .order-form-wrapper { padding: 16px; }
        }
    </style>
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/">
                    <img src="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg" alt="Shulamith Gallery">
                </a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/">الرئيسية</a></li>
                <li><a href="/gallery.html">المعارض</a></li>
                <li><a href="/rate.html">التقييمات</a></li>
                <li><a href="/order.html" class="active">طلب عمل</a></li>
                <li><a href="/#contact">تواصل</a></li>
            </ul>
            <div class="nav-actions">
                <button class="lang-switch" id="langSwitch"><span class="lang-text">AR</span></button>
                <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <!-- ===== PAGE HEADER ===== -->
    <section class="page-header">
        <div class="container">
            <h1>📦 اطلب عمل فني</h1>
            <p>احصل على عمل فني مخصص حسب طلبك</p>
        </div>
    </section>

    <!-- ===== ORDER FORM ===== -->
    <section>
        <div class="container">
            <div class="order-form-wrapper">
                <form id="orderForm" class="order-form">
                    <div class="form-group">
                        <label for="orderName">الاسم</label>
                        <input type="text" id="orderName" name="name" required placeholder="أدخل اسمك">
                        <span class="form-error" id="nameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="orderPhone">رقم الهاتف</label>
                        <input type="tel" id="orderPhone" name="phone" required placeholder="أدخل رقم الهاتف">
                        <span class="form-error" id="phoneError"></span>
                    </div>

                    <div class="form-group">
                        <label for="orderEmail">البريد الإلكتروني</label>
                        <input type="email" id="orderEmail" name="email" required placeholder="أدخل بريدك الإلكتروني">
                        <span class="form-error" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="orderText">تفاصيل الطلب</label>
                        <textarea id="orderText" name="orderText" required placeholder="اكتب تفاصيل العمل الفني الذي ترغب به..."></textarea>
                        <span class="form-error" id="orderTextError"></span>
                    </div>

                    <button type="submit" class="submit-btn" id="orderSubmit">
                        <span>إرسال الطلب</span>
                        <span class="btn-loading">جاري الإرسال...</span>
                    </button>

                    <div class="form-status" id="formStatus"></div>
                </form>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Shulamith Gallery. جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script>
        // ===== LANGUAGE =====
        let currentLang = localStorage.getItem('shulamith-lang') || 'ar';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('shulamith-lang', lang);
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.className = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelector('.lang-text').textContent = lang.toUpperCase();
        }

        document.getElementById('langSwitch').addEventListener('click', () => {
            setLanguage(currentLang === 'ar' ? 'en' : 'ar');
        });

        // ===== NAV =====
        document.getElementById('navToggle').addEventListener('click', function() {
            document.getElementById('navMenu').classList.toggle('active');
            this.classList.toggle('active');
        });

        // ===== SUBMIT ORDER =====
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('orderName');
            const phone = document.getElementById('orderPhone');
            const email = document.getElementById('orderEmail');
            const orderText = document.getElementById('orderText');
            const submitBtn = document.getElementById('orderSubmit');
            const status = document.getElementById('formStatus');

            // Reset errors
            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            status.className = 'form-status';
            status.style.display = 'none';

            let isValid = true;

            if (!name.value.trim()) {
                document.getElementById('nameError').textContent = 'الاسم مطلوب';
                isValid = false;
            }

            if (!phone.value.trim()) {
                document.getElementById('phoneError').textContent = 'رقم الهاتف مطلوب';
                isValid = false;
            }

            if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                document.getElementById('emailError').textContent = 'بريد إلكتروني غير صالح';
                isValid = false;
            }

            if (!orderText.value.trim()) {
                document.getElementById('orderTextError').textContent = 'تفاصيل الطلب مطلوبة';
                isValid = false;
            }

            if (!isValid) return;

            submitBtn.disabled = true;
            submitBtn.querySelector('span:first-child').style.display = 'none';
            submitBtn.querySelector('.btn-loading').style.display = 'inline';

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name.value.trim(),
                        phone: phone.value.trim(),
                        email: email.value.trim(),
                        orderText: orderText.value.trim()
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    status.className = 'form-status success';
                    status.style.display = 'block';
                    status.textContent = '✓ تم إرسال طلبك بنجاح! سنتواصل معك قريباً.';
                    this.reset();
                } else {
                    status.className = 'form-status error';
                    status.style.display = 'block';
                    status.textContent = data.error || 'حدث خطأ، حاول مرة أخرى';
                }
            } catch (error) {
                status.className = 'form-status error';
                status.style.display = 'block';
                status.textContent = 'حدث خطأ في الاتصال، حاول مرة أخرى';
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span:first-child').style.display = 'inline';
                submitBtn.querySelector('.btn-loading').style.display = 'none';
            }
        });

        // ===== INIT =====
        setLanguage(currentLang);
    </script>
</body>
</html>
