<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقييمات — Shulamith Gallery</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg">
    
    <style>
        :root {
            --color-bg: #0d0b0a;
            --color-bg-secondary: #161210;
            --color-bg-card: #1e1a18;
            --color-bg-hover: #2a2421;
            --color-primary: #d4b892;
            --color-primary-light: #e8d4bc;
            --color-primary-dark: #b89a72;
            --color-text: #e8e0d4;
            --color-text-muted: #b0a89a;
            --color-text-dark: #8a8272;
            --color-border: #2a2421;
            --color-success: #2ecc71;
            --color-error: #e74c3c;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Tahoma', Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.7;
            min-height: 100vh;
        }

        body.rtl { direction: rtl; }
        body.ltr { direction: ltr; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-bg); }
        ::-webkit-scrollbar-thumb { background: var(--color-primary-dark); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(13, 11, 10, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-logo img { height: 45px; width: auto; border-radius: var(--radius-sm); }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .nav-menu li a {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
            padding: 4px 0;
            position: relative;
        }

        .nav-menu li a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--color-primary);
            transition: var(--transition);
        }

        .nav-menu li a:hover,
        .nav-menu li a.active {
            color: var(--color-white);
        }

        .nav-menu li a:hover::after,
        .nav-menu li a.active::after {
            width: 100%;
        }

        body.ltr .nav-menu li a::after { left: 0; right: auto; }
        body.rtl .nav-menu li a::after { left: auto; right: 0; }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .lang-switch:hover {
            background: var(--color-bg-hover);
            border-color: var(--color-primary-dark);
        }

        .nav-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .nav-toggle span {
            display: block;
            width: 26px;
            height: 2px;
            background: var(--color-text);
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .nav-toggle.active span:nth-child(2) { opacity: 0; }
        .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(13, 11, 10, 0.98);
                flex-direction: column;
                padding: 20px;
                gap: 16px;
                border-bottom: 1px solid var(--color-border);
            }
            .nav-menu.active { display: flex; }
            .nav-toggle { display: flex; }
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            padding: 110px 0 30px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 300;
            color: var(--color-primary);
            letter-spacing: 2px;
        }

        .page-header p {
            color: var(--color-text-muted);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        /* ===== RATE FORM ===== */
        .rate-form-wrapper {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 40px;
            margin-bottom: 40px;
        }

        .rate-form .form-group {
            margin-bottom: 20px;
        }

        .rate-form label {
            display: block;
            color: var(--color-text-muted);
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .rate-form input,
        .rate-form textarea,
        .rate-form select {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: 1rem;
            transition: var(--transition);
            font-family: inherit;
        }

        .rate-form input:focus,
        .rate-form textarea:focus,
        .rate-form select:focus {
            outline: none;
            border-color: var(--color-primary-dark);
            box-shadow: 0 0 0 3px rgba(212, 184, 146, 0.08);
        }

        .rate-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .rate-form .form-error {
            color: var(--color-error);
            font-size: 0.85rem;
            display: block;
            margin-top: 4px;
            min-height: 20px;
        }

        .rate-form .star-rating {
            display: flex;
            flex-direction: row-reverse;
            gap: 8px;
            justify-content: flex-end;
        }

        body.ltr .rate-form .star-rating {
            flex-direction: row;
        }

        .rate-form .star-rating input {
            display: none;
        }

        .rate-form .star-rating label {
            font-size: 2.2rem;
            color: var(--color-border);
            cursor: pointer;
            transition: var(--transition);
            margin: 0;
        }

        .rate-form .star-rating label:hover,
        .rate-form .star-rating label:hover ~ label,
        .rate-form .star-rating input:checked ~ label {
            color: #f1c40f;
        }

        body.ltr .rate-form .star-rating label:hover ~ label {
            color: #f1c40f;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: var(--color-bg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .submit-btn:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 184, 146, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loading { display: none; }

        .form-status {
            margin-top: 16px;
            padding: 12px;
            border-radius: var(--radius-sm);
            display: none;
            font-size: 0.95rem;
            text-align: center;
        }

        .form-status.success {
            display: block;
            background: rgba(46, 204, 113, 0.15);
            color: var(--color-success);
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .form-status.error {
            display: block;
            background: rgba(231, 76, 60, 0.15);
            color: var(--color-error);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        /* ===== RATES LIST ===== */
        .rates-section h2 {
            color: var(--color-primary);
            font-size: 1.6rem;
            font-weight: 300;
            margin-bottom: 20px;
            text-align: center;
        }

        .rates-grid {
            display: grid;
            gap: 16px;
        }

        .rate-item {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: var(--transition);
        }

        .rate-item:hover {
            border-color: var(--color-primary-dark);
        }

        .rate-item .rate-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .rate-item .rate-name {
            color: var(--color-text);
            font-size: 1.05rem;
            font-weight: 500;
        }

        .rate-item .rate-stars {
            color: #f1c40f;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .rate-item .rate-stars .empty {
            color: var(--color-border);
        }

        .rate-item .rate-email {
            color: var(--color-text-dark);
            font-size: 0.85rem;
        }

        .rate-item .rate-opinion {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .rate-item .rate-date {
            color: var(--color-text-dark);
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-muted);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--color-bg-secondary);
            border-top: 1px solid var(--color-border);
            padding: 40px 0 20px;
            text-align: center;
            margin-top: 40px;
        }

        .footer p {
            color: var(--color-text-dark);
            font-size: 0.85rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            .rate-form-wrapper { padding: 24px; }
        }

        @media (max-width: 480px) {
            .page-header { padding: 100px 0 20px; }
            .page-header h1 { font-size: 1.6rem; }
            .rate-form-wrapper { padding: 16px; }
            .rate-item { padding: 16px; }
        }
    </style>
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/">
                    <img src="https://i.postimg.cc/D0rwSp7r/Shulamith-Gallery.jpg" alt="Shulamith Gallery">
                </a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/">الرئيسية</a></li>
                <li><a href="/gallery">المعارض</a></li>
                <li><a href="https://shulamith-gallery.vercel.app/#about">عن الفنانة</a></li>
                <li><a href="/order">طلبات خاصة</a></li>
                <li><a href="/rate" class="active">تقييم</a></li>
                <li><a href="/#contact">تواصل</a></li>
            </ul>
            <div class="nav-actions">
                <button class="lang-switch" id="langSwitch"><span class="lang-text">AR</span></button>
                <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
            </div>
        </div>
    </nav>

    <!-- ===== PAGE HEADER ===== -->
    <section class="page-header">
        <div class="container">
            <h1>التقييمات</h1>
            <p>شاركنا رأيك وساعدنا في تحسين خدماتنا</p>
        </div>
    </section>

    <!-- ===== RATE FORM ===== -->
    <section>
        <div class="container">
            <div class="rate-form-wrapper">
                <form id="rateForm" class="rate-form">
                    <div class="form-group">
                        <label for="rateName">الاسم</label>
                        <input type="text" id="rateName" name="name" required placeholder="أدخل اسمك">
                        <span class="form-error" id="nameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="rateEmail">البريد الإلكتروني</label>
                        <input type="email" id="rateEmail" name="email" required placeholder="أدخل بريدك الإلكتروني">
                        <span class="form-error" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label>التقييم</label>
                        <div class="star-rating" id="starRating">
                            <input type="radio" name="rating" id="star5" value="5">
                            <label for="star5">★</label>
                            <input type="radio" name="rating" id="star4" value="4">
                            <label for="star4">★</label>
                            <input type="radio" name="rating" id="star3" value="3">
                            <label for="star3">★</label>
                            <input type="radio" name="rating" id="star2" value="2">
                            <label for="star2">★</label>
                            <input type="radio" name="rating" id="star1" value="1">
                            <label for="star1">★</label>
                        </div>
                        <span class="form-error" id="ratingError"></span>
                    </div>

                    <div class="form-group">
                        <label for="rateOpinion">الرأي</label>
                        <textarea id="rateOpinion" name="opinion" required placeholder="اكتب رأيك هنا..."></textarea>
                        <span class="form-error" id="opinionError"></span>
                    </div>

                    <button type="submit" class="submit-btn" id="rateSubmit">
                        <span>إرسال التقييم</span>
                        <span class="btn-loading">جاري الإرسال...</span>
                    </button>

                    <div class="form-status" id="formStatus"></div>
                </form>
            </div>
        </div>
    </section>

    <!-- ===== RATES LIST ===== -->
    <section>
        <div class="container">
            <div class="rates-section">
                <h2>آراء العملاء</h2>
                <div class="rates-grid" id="ratesGrid">
                    <div class="empty-state">لا توجد تقييمات حالياً</div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Shulamith Gallery. جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script>
        // ===== LANGUAGE =====
        let currentLang = localStorage.getItem('shulamith-lang') || 'ar';
        let refreshInterval = null;

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('shulamith-lang', lang);
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.className = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelector('.lang-text').textContent = lang.toUpperCase();
        }

        document.getElementById('langSwitch').addEventListener('click', () => {
            setLanguage(currentLang === 'ar' ? 'en' : 'ar');
        });

        // ===== NAV =====
        document.getElementById('navToggle').addEventListener('click', function() {
            document.getElementById('navMenu').classList.toggle('active');
            this.classList.toggle('active');
        });

        // ===== LOAD RATES =====
        async function loadRates() {
            const grid = document.getElementById('ratesGrid');
            try {
                const res = await fetch('/api/rates');
                if (!res.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await res.json();

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="empty-state">لا توجد تقييمات حالياً</div>';
                    return;
                }

                let html = '';
                data.forEach(rate => {
                    const stars = '★'.repeat(rate.rating) + '☆'.repeat(5 - rate.rating);
                    const date = rate.createdAt ? new Date(rate.createdAt).toLocaleDateString('ar') : '';
                    html += `
                        <div class="rate-item">
                            <div class="rate-header">
                                <span class="rate-name">${rate.name}</span>
                                <span class="rate-stars">${stars}</span>
                            </div>
                            <div class="rate-email">${rate.email}</div>
                            <div class="rate-opinion">${rate.opinion}</div>
                            <div class="rate-date">${date}</div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

            } catch (error) {
                console.error('Error loading rates:', error);
                grid.innerHTML = '<div class="empty-state">حدث خطأ في تحميل التقييمات</div>';
            }
        }

        // ===== SUBMIT RATE =====
        document.getElementById('rateForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('rateName');
            const email = document.getElementById('rateEmail');
            const opinion = document.getElementById('rateOpinion');
            const rating = document.querySelector('input[name="rating"]:checked');
            const submitBtn = document.getElementById('rateSubmit');
            const status = document.getElementById('formStatus');

            // Reset errors
            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            status.className = 'form-status';
            status.style.display = 'none';

            let isValid = true;

            if (!name.value.trim()) {
                document.getElementById('nameError').textContent = 'الاسم مطلوب';
                isValid = false;
            }

            if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                document.getElementById('emailError').textContent = 'بريد إلكتروني غير صالح';
                isValid = false;
            }

            if (!rating) {
                document.getElementById('ratingError').textContent = 'الرجاء اختيار تقييم';
                isValid = false;
            }

            if (!opinion.value.trim()) {
                document.getElementById('opinionError').textContent = 'الرأي مطلوب';
                isValid = false;
            }

            if (!isValid) return;

            submitBtn.disabled = true;
            submitBtn.querySelector('span:first-child').style.display = 'none';
            submitBtn.querySelector('.btn-loading').style.display = 'inline';

            try {
                const res = await fetch('/api/rates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name.value.trim(),
                        email: email.value.trim(),
                        rating: parseInt(rating.value),
                        opinion: opinion.value.trim()
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    status.className = 'form-status success';
                    status.style.display = 'block';
                    status.textContent = 'تم إرسال التقييم بنجاح! شكراً لك.';
                    this.reset();
                    loadRates();
                } else {
                    status.className = 'form-status error';
                    status.style.display = 'block';
                    status.textContent = data.error || 'حدث خطأ، حاول مرة أخرى';
                }
            } catch (error) {
                status.className = 'form-status error';
                status.style.display = 'block';
                status.textContent = 'حدث خطأ في الاتصال، حاول مرة أخرى';
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span:first-child').style.display = 'inline';
                submitBtn.querySelector('.btn-loading').style.display = 'none';
            }
        });

        // ===== REFRESH FUNCTION =====
        function startAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
            refreshInterval = setInterval(() => {
                loadRates();
            }, 5000);
        }

        // ===== INIT =====
        setLanguage(currentLang);
        loadRates();
        startAutoRefresh();

        // Clean up interval on page unload
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
